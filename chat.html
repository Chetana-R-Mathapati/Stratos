<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Skill Chat Room</title>
  <style>
    body {
      font-family: Arial;
      background: #f1f1f1;
      padding: 20px;
    }
    #room-title {
      font-size: 24px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #chat-box {
      background: white;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-bottom: 10px;
    }
    #chat-box div {
      margin-bottom: 8px;
      background: #e2e3e5;
      padding: 8px;
      border-radius: 5px;
    }
    #typing-indicator {
      font-size: 14px;
      color: gray;
      margin-bottom: 10px;
      height: 20px;
    }
    form {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
    }
    button {
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .live-section {
      margin: 20px 0;
      padding: 15px;
      background: white;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .live-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    #startLive {
      background: #dc3545;
    }
    #startLive.live {
      background: #28a745;
    }
    .live-status {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      font-size: 14px;
      color: #666;
    }
    .live-indicator {
      display: none;
      align-items: center;
      gap: 5px;
      color: #dc3545;
      font-weight: bold;
    }
    .live-indicator.active {
      display: flex;
    }
    .live-indicator::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #dc3545;
      border-radius: 50%;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      50% { opacity: 0.5; }
    }
    #video-container {
      width: 100%;
      max-width: 640px;
      margin: 10px 0;
      display: none;
    }
    #localVideo {
      width: 100%;
      border-radius: 5px;
    }
    .last-live {
      font-style: italic;
      color: #666;
    }
    .streamer-name {
      font-weight: bold;
      color: #007bff;
    }
  </style>
</head>
<body>



  <div id="chat-box"></div>
  <div id="typing-indicator"></div>
  <form id="chat-form">
    <input type="text" id="msg" placeholder="Type a message" autocomplete="off" required />
    <button type="submit">Send</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/socket.io/socket.io.js"></script>
<script>
const socket = io(); // connect to server

const params = new URLSearchParams(window.location.search);
const username = params.get("username") || "Anonymous";
const skill = params.get("skill") || "general";

// Join room
socket.emit("joinRoom", { username, room: skill });

// Send message
document.getElementById("chat-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const msgInput = document.getElementById("msg");
  const msg = msgInput.value;

  if (!msg) return;

  // Display message instantly
  appendMessage(`Me: ${msg}`);

  // Emit to server
  socket.emit("chatMessage", msg);

  msgInput.value = "";
});

// Receive messages
socket.on("chatMessage", ({ username: sender, msg }) => {
  // Skip displaying the sender’s own message twice
  if (sender !== "Me") appendMessage(`${sender}: ${msg}`);
});

// Typing indicator
document.getElementById("msg").addEventListener("input", () => {
  socket.emit("typing");
});

socket.on("typing", (typingUser) => {
  const typingDiv = document.getElementById("typing-indicator");
  typingDiv.innerText = `${typingUser} is typing...`;
  clearTimeout(typingDiv._timeout);
  typingDiv._timeout = setTimeout(() => typingDiv.innerText = "", 2000);
});

function appendMessage(text) {
  const div = document.createElement("div");
  div.innerText = text;
  document.getElementById("chat-box").appendChild(div);
  document.getElementById("chat-box").scrollTop = document.getElementById("chat-box").scrollHeight;
}
</script>

</body>
</html>
