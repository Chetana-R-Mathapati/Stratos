<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skill Chat Room</title>
<style>
  body { font-family: Arial; background: #f1f1f1; padding: 20px; }
  #chat-box { background: white; height: 300px; overflow-y: auto; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px; }
  #chat-box div { margin-bottom: 8px; background: #e2e3e5; padding: 8px; border-radius: 5px; }
  form { display: flex; gap: 10px; }
  input[type="text"] { flex: 1; padding: 10px; }
  button { padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>

<h2>Skill Chat Room</h2>
<div id="chat-box"></div>
<div id="typing-indicator"></div>
<form id="chat-form">
  <input type="text" id="msg" placeholder="Type a message" autocomplete="off" required />
  <button type="submit">Send</button>
</form>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  // Prompt for username & room if not passed in query string
  let params = new URLSearchParams(window.location.search);
  const username = params.get("username") || prompt("Enter your name:");
  const room = params.get("skill") || prompt("Enter room name:");

  socket.emit("joinRoom", { username, room });

  // Send message
  const msgInput = document.getElementById("msg");
  document.getElementById("chat-form").addEventListener("submit", e => {
    e.preventDefault();
    const msg = msgInput.value.trim();
    if (!msg) return;

    // Display instantly
    appendMessage(`Me: ${msg}`);

    // Send to server
    socket.emit("chatMessage", msg);

    msgInput.value = "";
  });

  // Receive message
  socket.on("chatMessage", ({ username: sender, msg }) => {
    if (sender !== username) appendMessage(`${sender}: ${msg}`);
  });

  // Typing indicator
  msgInput.addEventListener("input", () => socket.emit("typing"));
  socket.on("typing", typingUser => {
    const typingDiv = document.getElementById("typing-indicator");
    typingDiv.innerText = `${typingUser} is typing...`;
    clearTimeout(typingDiv._timeout);
    typingDiv._timeout = setTimeout(() => typingDiv.innerText = "", 2000);
  });

  function appendMessage(text) {
    const div = document.createElement("div");
    div.innerText = text;
    document.getElementById("chat-box").appendChild(div);
    document.getElementById("chat-box").scrollTop = document.getElementById("chat-box").scrollHeight;
  }
</script>

</body>
</html>
